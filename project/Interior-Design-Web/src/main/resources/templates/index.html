<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>My first three.js app</title>
	<style>

		/* Root used for colours and general variables*/
		:root{
			--divOptionColour:  rgb(14, 42, 65);
			--divSelectedColour:  rgb(32, 81, 121);
			--regularTextColour: rgba(240, 255, 255, 0.548);
			--selectedTextColour: rgba(240, 255, 255, 0.945);

			--topNavHeightExpansion: 95px;
			--leftSideBarExpansion: 120px;

			--leftSide2ndMaxWidth: 120px;

			--bottomNavHeightExmapsion: 240px;

			--rightSideBarWidth: 500px;
			--editButtons: 500px;
			--editButtonsWidth: 180px;
			--editButtonsColour: rgb(73 73 73 / 0.95);
			--editButtonHighlight: rgb(131 131 131 / 0.95);

			--livingRoomButtonColour: rgb(237 100 100);
			--kitchenButtonColour: rgb(227 201 67 / 0.82);
			--bathroomButtonColour: rgba(0, 185, 232, 0.82);
			--bedroomButtonColour: rgb(189, 107, 235);

			--leftSide1stBackgroundColour: #bdc3c3;
			--rightSideLabelTextColour: #939797;
			--XYZBoxColour: #c2c0c0;
			--XYZValueTextColour: #191919;




		}

		.left-boarder{
			display: flex;
			justify-content: center;
		}

		.top-navbar-div{
			position: fixed;	/* places the bar exactly where it should be, preventing any movement when new elements are added */
			display: flex;

			flex-direction: row;
			justify-content: center;

			width: 100vw;
			overflow-x: hidden;
			height: var(--topNavHeightExpansion);	/*covers the entire screen size*/
			max-width: 90vw;          /* Places a maximum width of 80px, so any width larger that that gets capped */
			margin-right: 50px;          /* Add space to the sides */
			margin-left: 50px;


			/*border-bottom-style: dotted;*/	/*!* temporary dots so I know where the border ends *!*/
			border-bottom-width: 1px;

			transition: height 0.3s;
			overflow-y: hidden;
		}

		.top-nav-1st{
			margin-top: 0px;
		}

		.top-nav-2nd{
			margin-top: var(--topNavHeightExpansion);
			height: 0px;	/*covers the entire screen size*/

		}

		.main-Option{
			padding: 5px;
			margin: 10px;
			display: flex;
			flex-direction: row;
			gap: 5px; /* Gap between the button div */

			text-align: center;
		}

		.main-option-button{
			display: flex;
			flex-direction: column;
			background-color: var(--divOptionColour);
			width: 90px;
			height: 70px;
			border-radius: 15px;

		}

		.room-Options{
			width: 90px;
			height: 50px;
		}

		/* Div that displays the options (new / load room) */
		.room-option-div{
			padding: 5px;
			margin: 10px;
			display: flex;
			flex-direction: row;
			gap: 5px; /* Gap between the button div */

			text-align: center;

		}


		.room-option-button{
			display: flex;
			flex-direction: column;
			width: 90px;
			height: 70px;
			border-radius: 15px;

		}

		.new-room-div{
			background-color: rgba(127, 136, 255, 0.719);
		}

		.load-room-div{
			background-color: rgb(80, 165, 180);
		}

		/* Side bar for the insert options */
		.left-sidebar-div{
			position: fixed;	/*places the bar exactly where it should be, preventing any movement when new elements are added */
			display: flex;
			/* places them in the center, so when adding new elements, will center
                them in a column.*/
			flex-direction: column;
			justify-content: center;

			width: 0;
			overflow-x: hidden;
			height: 100vh;	/*covers the entire screen size*/
			max-height: 80vh;          /* Places a maximun height of 80px, so any height larger that that gets capped */
			margin-top: 80px;          /* Add space at the top of the sidebar */
			margin-bottom: 50px;

			/*border-right-style: dotted;	!* temporary dots so I know where the border ends *!*/
			/*border-right-width: 1px;*/

			/* ref: https://www.w3schools.com/howto/tryit.asp?filename=tryhow_js_sidenav_push_opacity */
			transition: width 0.3s;	/* Transition of the appearance when the width changes on clicking the
				new room button. This is the reason why its at 0. The transition between 0 and the set value in the javascript
				will be done in the specified time above.*/

			/*background-color: var(--leftSide1stBackgroundColour);*/
		}

		/* Right navigation bar for the object information. */
		/* https://www.w3schools.com/w3css/w3css_sidebar.asp */
		.right-sidebar-div{
			right: 0;	/* Displays the bar to the right instead of the left */
			position: fixed;
			display: flex;

			flex-direction: column;


			width: 0px;
			overflow-x: hidden;
			height: 100vh;
			max-height: 100vh;
			margin-top: 80px;
			margin-bottom: 50px;

			/*border-left-style: dotted;*/
			/*border-left-width: 1px;*/

			transition: width 0.3s;

		}

		/* Side bar for the insert options */
		.left-sidebar-2nd{
			margin-left: 120px;
			width: 0px;

		}

		/* div that contains the list such as kitchen, bedroom etc*/
		.object-type-options{
			flex-direction: column;
			align-items: center;


			gap: 10px; /* Gap between the button div */

			text-align: center;


		}

		.objectImage{
			display: block;
			margin-left: auto;
			margin-right: auto;
			width: 250px;
			height: 200px;
		}

		.object-scrollpane{
			display: none;
			flex-direction: row;
			align-items: center;
			margin: 30px;


			overflow-y: auto;
			gap: 80px;

		}



		.object-item{
			background-color: cornflowerblue;
			border: 1px solid #ddd;
			width: 100px;
			height: 100px;
			background-color: #a5c8d6;
			padding: 12px;
		}


		.wall-Options{
			padding: 5px;
			margin: 10px;
			display: flex;
			flex-direction: column;
			gap: 10px; /* Gap between the button div */

			text-align: center;
			background-color: var(--leftSide1stBackgroundColour);
		}

		.design-Options{
			padding: 5px;
			margin: 10px;
			display: none;
			flex-direction: column;
			gap: 10px; /* Gap between the button div */

			text-align: center;
			border-radius: 10px;
			background-color: var(--leftSide1stBackgroundColour);

			align-content: center;
		}

		.designOption{

			width: 90px;
			height: 90px;
			border-radius: 10px;
			background-color: var(--divOptionColour);
			color: var(--regularTextColour);

		}

		.object-type-Button{

			width: 90px;
			height: 90px;
			border-radius: 10px;

			text-align: center;
		}



		#livingRoomButton{
			background-color: var(--livingRoomButtonColour);;
		}

		#kitchenButton{
			background-color: var(--kitchenButtonColour);;
		}

		#bathroomButton{
			background-color: var(--bathroomButtonColour);;
		}

		#bedroomButton{
			background-color: var(--bedroomButtonColour);;
		}



		/* Object menu for the right side of the screen. */
		.object-menu-options{
			text-align: center;
			display: flex;
			flex-direction: column;

		}

		/* needed for the scroll search max */
		.object-details-div{
			display: flex;
			flex-direction: column;
			max-height: 98vh;
			gap: 1em;
		}


		.desc-price-details-section{
			display: flex;
			flex-direction: column;
			align-self: flex-start;
			margin-top: 0;
			width: 50%;
			max-height: 200px;
		}

		.object-details-section{
			display: flex;
			flex-direction: column;
			justify-content: left;
			margin-top: 0;
			width: 100%;

		}


		#objectDescription{
			display: block;
			word-wrap: break-word;
			white-space: normal;
			overflow-y: auto;
			overflow-x: hidden;
		}

		/* Used for the object search bar */
		.object-search-div{
			display: flex;
			flex-direction: row;
			margin-left: auto;
			margin-right: auto;

		}

		.object-property-section{
			margin: 35px;
			overflow-x: auto;
			max-height: 125px;
		}

		.object-XYZ-values{
			display: flex;
			flex-direction: row;
			justify-content: center;
			gap:10px;

		}

		.XYZ-container{
			display: flex;
			flex-direction: column;
			gap: 2px;

		}


		.scale-properties{
			display: flex;
			flex-direction: column;
			gap: 10px;
		}

		.scale-value-section {
			display: flex;
			flex-direction: row;
			justify-content: center;
			align-items: center;
			gap: 10px;
			font-size: 15px;
		}

		.scale-value-input {
			text-align: center;
			min-width: 40px;
			max-width: 120px;
			width: 80px;
			font-size: 15px;

			border: none;
			background-color: var(--XYZBoxColour);
			color: var(--XYZValueTextColour);

		}

		.scale-max-value-input {
			width: 80px;
			text-align: center;
			font-size: 20px;
		}

		/* Pushes the scale of the bar size to the max of the width */
		.scale-value-section input[type="number"] {

		}






		.right-side-mini-text{
			font-size: 15px;
			text-align: right;
		}



		.search-scrollpane{
			display: none;
			flex-direction: column;
			align-items: center;
			max-width: 100vw;
			max-height: 40em;
			margin-top: 20px;
			margin-bottom: 20px;

			overflow-y: auto;

		}




		.wallButton{

			width: 90px;
			height: 90px;
			border-radius: 10px;

			background-color: rgb(128 181 178);
		}

		.labelTitles{
			font-size: 25px;
			/*background-color: var(--rightSideLabelBackgroundColour);*/
		}

		.labelSubTitles{
			font-size: 18px;
			/*background-color: var(--rightSideLabelBackgroundColour);*/
		}

		.labelSectionTitles{
			font-size: 16px;
			/*background-color: var(--rightSideLabelBackgroundColour);*/
		}


		.labelTitleColour{
			color: var(--rightSideLabelTextColour);
		}


		/* the finish wall button will get displayed whenever ther is at least one wall visible*/
		#finishWallButton{
			display: none;
			flex-direction: column;
			text-align: center;

		}




		.bottom-bar-div{
			position: fixed;	/* places the bar exactly where it should be, preventing any movement when new elements are added */
			bottom: 0;


			width: 100vw;
			overflow-x: hidden;
			height: 0;	/*covers the entire screen size*/
			max-width: 90vw;          /* Places a maximun width of 80px, so any width larger that that gets capped */
			margin-right: 50px;          /* Add space ato the sides */
			margin-left: 70px;


			/*border-bottom-style: dotted;*/	/*!* temporary dots so I know where the border ends *!*/
			border-bottom-width: 1px;

			transition: height 0.3s;
			overflow-y: hidden;
			background-color: var(--leftSide1stBackgroundColour);
			border-radius: 15px;

		}


		#optionTypeName{
			font-size: 20px;
		}

		.obj-container{
			width: 100%;
			margin-left: auto;
		}



		/* width */
		::-webkit-scrollbar {
			width: 10px;
		}

		/* Track */
		::-webkit-scrollbar-track {
			background: #f1f1f1;
		}

		/* Handle */
		::-webkit-scrollbar-thumb {
			background: #888;
		}

		/* Handle on hover */
		::-webkit-scrollbar-thumb:hover {
			background: #555;
		}


		.colour-selection input[type="color"] {
			appearance: none;
			-webkit-appearance: none;
			border: none;
			background: none;
			padding: 0;
			width: 40px;
			height: 40px;
			cursor: pointer;
		}

		.colour-selection input[type="color"]::-webkit-color-swatch-wrapper {
			padding: 0;
			border-radius: 2px;
		}

		.colour-selection input[type="color"]::-webkit-color-swatch {
			border-radius: 10px;
		}


		.Section_1{
			display: flex;
			flex-direction: row;
		}

		.Section_2{
			display: flex;
			flex-direction: row;
			justify-content: center;
		}

		.right-sidebar-2nd-div{
			right: var(--editButtons);
			gap: 10px;
			position: fixed;
			display: flex;

			flex-direction: column;
			justify-content: flex-end;


			width: 0;
			overflow-x: hidden;
			height: 100vh;
			max-height: 100vh;
			margin-bottom: 100px;


		}

		.edit-container{
			display: flex;
			flex-direction: row;
			width: var(--editButtonsWidth);
			gap: 5px;
		}

		.edit-hidden-container{
			display: none;
			flex-direction: row;
			width: var(--editButtonsWidth);
			gap: 5px;
		}

		.edit-label{
			width: 140px;
			margin: auto;
			display: flex;
			justify-content: flex-end;



			font-weight: 700;
			color: var(--editButtonsColour);


		}

		.edit-Icon{
			right: 0;
			width: 50px;
			height: 50px;
			text-align: center;
			color: white;

			display: flex;
			justify-content: center;
			align-items: center;

			background-color: var(--editButtonsColour);

			border-radius: 15px;

		}

		body {
			margin: 0;
			font-family: sans-serif, Helvetica, Arial;

		}

	</style>

	<script type="importmap">
		{
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.172.0/examples/jsm/",
            "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
          }
        }
	</script>
</head>
<body>

<div id="left-boarder" style="position: absolute;">

	<div class="wrap">
		<!-- sidebar that will display the options -->
		<div class="left-sidebar-div leftSide1st" id="leftSidebar">

			<!-- wall options for the sidebar-->
			<div class="wall-Options" id="wallOptions">
				<!-- given the same class as they should be treated the same in terms of styling-->
				<div class="wallButton" id="newWallButton">New wall</div>
				<div class="wallButton" id="removeWallButton">Remove last wall</div>
				<div class="wallButton" id="finishWallButton">Finish</div>
				<div class="wallButton" id="cancelWallButton">Clear</div>

			</div>

			<div class="design-Options" id="designOptions">
				<!-- given the same class as they should be treated the same in terms of styling-->
				<div class="designOption" id="addFurniture" >Furniture</div>
				<div class="designOption" id="addDecor" >Decoration</div>
				<div class="designOption" id="addDoor" >Doors</div>
				<div class="designOption" id="addWindow">Windows</div>

			</div>


		</div>



		<div class="left-sidebar-div left-sidebar-2nd" id="leftSidebar2nd">

			<!-- wall options for the side bar-->
			<label class="objectTypeLabel" id="objectTypeLabelName" style="text-align: center">Label</label>
			<div class="object-type-options" id="objectOptions">
				<div class="object-type-Button" id="livingRoomButton" onclick="ShowLivingRoomObjects()">Living room</div>
				<div class="object-type-Button" id="kitchenButton" onclick="ShowKitchenObjects()">Kitchen</div>
				<div class="object-type-Button" id="bathroomButton" onclick="ShowBathroomObjects()">Bathroom</div>
				<div class="object-type-Button" id="bedroomButton" onclick="ShowBedroomObjects()">Bedroom</div>
			</div>


		</div>


	</div>





	<div class="wrap">
		<!-- sidebar that will dispaly the options -->
		<div class="top-navbar-div top-nav-1st" id="topNavBar">

			<!-- the room options for the top navigation bar-->
			<div class="main-Option" id="mainOptions">
				<div class="main-option-button" id="changeCameraPerspectiveDiv" style="color: var(--regularTextColour);" onclick="changeCamPerspective()">
					<div><img src="/images/eye.png"></div>
					Overhead view
				</div>
				<div class="main-option-button" id="createRoomDiv" style="color: var(--regularTextColour); text-align: center" onclick="doSomething()">
					<div><img src="/images/roomIcon.png"></div>
					Room
				</div>

			</div>


		</div>

		<div class="top-navbar-div top-nav-2nd" id="topNavBar2nd">

			<!-- the room options for the top navigation bar-->
			<div class="room-option-div" id="roomOptionBox">
				<div class="room-option-button new-room-div" id="new-room-button">New room</div>
				<div class="room-option-button load-room-div" id="load-room-button">Load room</div>
			</div>


		</div>
	</div>

	<div class="right-side-container">
		<div class="right-sidebar-div" id="rightSidebar" style="background-color: #dddddd">

			<!-- wall options for the sidebar-->
			<div class="object-menu-options" id="objectMenuOptions">
				<!-- given the same class as they should be treated the same in terms of styling-->

				<div class="object-details-div" id="objectDetails">
					<div class="object-details-section">
						<label>Object name</label>
						<label class="labelTitles " id="objectName">objectName</label>
					</div>

					<img src="" class="objectImage" id="objectImage" >

					<div class="Section_1">
						<div class="desc-price-details-section">
							<label class="labelTitles labelTitleColour">Description</label>
							<label id="objectDescription">description</label>
						</div>

						<div class="desc-price-details-section">
							<label class="labelTitles labelTitleColour">Price</label>
							<label id="objectPrice">price</label>
						</div>

					</div>


					<div class="object-details-section">
						<label class="labelTitles labelTitleColour">URL</label>
						<label id="objectURL">url</label>
					</div>

					<label class="labelTitles labelTitleColour">Object Properties</label>


				</div>





			</div>

			<div class="object-property-section" id="objectPropertiesSection">
				<div id="Scale Properties" class="scale-properties">

					<label class="labelSectionTitles labelTitleColour">Transform</label>
					<div class="object-XYZ-values">
						<div>
							<label class="labelSectionTitles labelTitleColour">Location</label>

							<!-- <div class="right-side-mini-text">
                                <label class="labelTitleColour">Max value</label>
                            </div> -->

						</div>

						<div class="XYZ-container">
							<div class="scale-value-section">
								<label>X</label>
								<input class="scale-value-input" type="number" id="locationRangeXValue" name="locationRangeXValue" min="-9999999" max="9999999" value="10">
								<!--  <input type="number" id="locationMaxXValueNumber" name="maxXValue" class="location-max-value-input">  -->
							</div>

							<div class="scale-value-section">
								<label>Y</label>
								<input class="scale-value-input" type="number" id="locationRangeYValue" name="locationRangeYValue" min="0" max="9999999" value="10">
								<!-- <input type="number" id="locationMaxYValueNumber" name="maxYValue" class="location-max-value-input"> -->
							</div>

							<div class="scale-value-section">
								<label>Z</label>
								<input class="scale-value-input" type="number" id="locationRangeZValue" name="locationRangeZValue" min="-9999999" max="9999999" value="10">
								<!-- <input type="number" id="locationMaxZValueNumber" name="maxZValue" class="location-max-value-input"> -->
							</div>

						</div>



					</div>



					<div class="object-XYZ-values">
						<div>
							<label class="labelSectionTitles labelTitleColour">Rotation</label>

							<!-- <div class="right-side-mini-text">
                                <label class="labelTitleColour">Max value</label>
                            </div> -->

						</div>

						<div class="XYZ-container">
							<div class="scale-value-section">
								<label>X</label>
								<input class="scale-value-input" type="number" id="rotationRangeXValue" name="rotationRangeXValue" min="-360" max="360" value="0">
								<!--  <input type="number" id="rotationMaxXValueNumber" name="maxXValue" class="rotation-max-value-input">  -->
							</div>

							<div class="scale-value-section">
								<label>Y</label>
								<input class="scale-value-input" type="number" id="rotationRangeYValue" name="rotationRangeYValue" min="-360" max="360" value="0">
								<!-- <input type="number" id="rotationMaxYValueNumber" name="maxYValue" class="rotation-max-value-input"> -->
							</div>

							<div class="scale-value-section">
								<label>Z</label>
								<input class="scale-value-input" type="number" id="rotationRangeZValue" name="rotationRangeZValue" min="-360" max="360" value="0">
								<!-- <input type="number" id="rotationMaxZValueNumber" name="maxZValue" class="rotation-max-value-input"> -->
							</div>

						</div>



					</div>




					<div class="object-XYZ-values">
						<div>
							<label class="labelSectionTitles labelTitleColour">Scale</label>

							<!-- <div class="right-side-mini-text">
                                <label class="labelTitleColour">Max value</label>
                            </div> -->

						</div>


						<div class="XYZ-container">
							<div class="scale-value-section">
								<label>X</label>
								<input class="scale-value-input" type="number" id="scaleRangeXValue" name="scaleRangeXValue" min="1" max="9999999" value="10">
								<!--  <input type="number" id="scaleMaxXValueNumber" name="maxXValue" class="scale-max-value-input">  -->
							</div>

							<div class="scale-value-section">
								<label>Y</label>
								<input class="scale-value-input" type="number" id="scaleRangeYValue" name="scaleRangeYValue" min="2" max="9999999" value="10">
								<!-- <input type="number" id="scaleMaxYValueNumber" name="maxYValue" class="scale-max-value-input"> -->
							</div>

							<div class="scale-value-section">
								<label>Z</label>
								<input class="scale-value-input" type="number" id="scaleRangeZValue" name="scaleRangeZValue" min="1" max="9999999" value="10">
								<!-- <input type="number" id="scaleMaxZValueNumber" name="maxZValue" class="scale-max-value-input"> -->
							</div>

						</div>



					</div>


				</div>

				<div class="labelSectionTitles labelTitleColour colour-selection" style="margin: auto;">

					Colour
					<input id="colourBox" type="color" value="#ff0000">

				</div>

			</div>


			<div class="object-details-section">
